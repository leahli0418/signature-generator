<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNC邮箱签名生成器</title>
<style>
  body { margin:0; padding:24px; background:#f5f5f5;
         font-family:"Microsoft YaHei",Arial,sans-serif; color:#333; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }
  .panel { background:#fff; border-radius:8px; padding:16px 20px;
           margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { font-size:15px; margin:0 0 12px; }
  .form { display:flex; flex-wrap:wrap; gap:12px 20px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:#666; }
  .field input { width:220px; padding:6px 8px; border:1px solid #ccc;
                 border-radius:4px; font-size:14px; box-sizing:border-box; }
  .field button { margin-top:8px; padding:6px 12px; font-size:12px; background:#555; color:#fff;
                  border:0; border-radius:4px; cursor:pointer; width:fit-content; }
  .field button:hover { background:#333; }
  
  .action-btns { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
  .btn { padding:8px 22px; font-size:14px; border:0; border-radius:4px; cursor:pointer; color:#fff; }
  .btn-blue { background:#1a73e8; }
  .btn-blue:hover { background:#1667cf; }
  .btn-green { background:#2e9e44; }
  .btn-green:hover { background:#248235; }
  .btn.done { background:#555 !important; }

  #preview { background:#f5f5f5; padding:16px; overflow:auto; }
  ol.steps { margin:0; padding-left:20px; font-size:13px; line-height:2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DNC邮箱签名生成器</h1>

  <!-- ===== 1. 填写信息 ===== -->
  <div class="panel">
    <h2>1. 填写信息</h2>
    <div class="form">
      <div class="field">
        <label>敬语（可选）</label>
        <input id="greeting" value="Best Regards," placeholder="如：Best Regards,">
      </div>
      <div class="field">
        <label>姓名（中文）</label>
        <input id="nameCn" value="李靓" placeholder="如：李靓">
      </div>
      <div class="field">
        <label>姓名（英文）</label>
        <input id="nameEn" value="Leah Li" placeholder="如：Leah Li">
      </div>
      <div class="field">
        <label>职位</label>
        <input id="title" value="执行总裁助理 Assistant to CEO" placeholder="如：执行总裁助理 Assistant to CEO">
      </div>
      <div class="field">
        <label>手机号</label>
        <input id="mobile" value="+86 137 6465 6552" placeholder="如：+86 137 6465 6552">
      </div>
      <div class="field">
        <label>邮箱</label>
        <input id="email" value="leah@dinengchuang.com" placeholder="如：leah@dinengchuang.com">
      </div>
      <div class="field">
        <label>公司中文名</label>
        <input id="companyCn" value="上海迪能创高新科技有限公司" placeholder="如：上海迪能创高新科技有限公司">
      </div>
      <div class="field">
        <label>公司英文名</label>
        <input id="companyEn" value="Shanghai Dineng Chuang High Tech Co., Ltd." placeholder="如：Shanghai Dineng Chuang High Tech Co., Ltd.">
      </div>
      <div class="field">
        <label>地址（中文）</label>
        <input id="addrCn" value="上海市浦东新区银城中路168号上海银行大厦24层2401室" placeholder="如：上海市浦东新区银城中路168号上海银行大厦24层2401室">
      </div>
      <div class="field">
        <label>地址（英文）</label>
        <input id="addrEn" value="24th Floor, Suite 2401, Shanghai Bank Tower, No. 168 Yincheng Middle Rd, Pudong New District, Shanghai, China" placeholder="如：24th Floor, Suite 2401, Shanghai Bank Tower...">
      </div>
      <div class="field">
        <label>网址</label>
        <input id="website" value="www.hiti.ae" placeholder="如：www.hiti.ae">
      </div>
      <div class="field">
        <label>Logo 图片 URL</label>
        <input id="logoUrl" value="https://raw.githubusercontent.com/leahli0418/signature-generator/main/HITI%20logo.png" placeholder="粘贴你公司Logo的图片链接">
        <button id="btnDownloadLogo">⬇️ 下载此 Logo</button>
      </div>
    </div>
  </div>

  <!-- ===== 2. 实时预览 ===== -->
  <div class="panel">
    <h2>2. 实时预览</h2>
    <div class="action-btns">
      <button id="btnCopyRich" class="btn btn-green">📋 一键复制签名（直接粘贴）</button>
    </div>
    <div id="preview" style="margin-top:12px; border:1px dashed #ccc; padding:16px; background:#fff;">
    </div>
  </div>

  <!-- ===== 3. 复制代码 ===== -->
  <div class="panel">
    <h2>3. 复制并粘贴到企业邮箱（高级）</h2>
    <div class="action-btns">
      <button id="btnCopy" class="btn btn-blue">复制 HTML 代码</button>
    </div>
    <ol class="steps" style="margin-top:12px;">
      <li>打开 PC 端企业邮箱，进入「邮件设置」→「写邮件」→「管理签名样式」</li>
      <li>点击「创建签名」→「更多」→「编辑 HTML 源码」</li>
      <li>粘贴复制的代码，然后选中签名中的图片，通过「插入图片」上传真实 logo</li>
      <li>保存并设为使用中的签名</li>
    </ol>
  </div>
</div>

<script>
// ========== 读取所有表单字段 ==========
function getData() {
  const ids = ['greeting','nameCn','nameEn','title','mobile','email',
               'companyCn','companyEn','addrCn','addrEn','website','logoUrl'];
  const d = {};
  ids.forEach(id => d[id] = document.getElementById(id).value.trim());
  return d;
}

// ========== 生成签名 HTML 模板 ==========
function buildSignature(d) {
  const emailLink = d.email.replace(/\s/g,'');
  const webLink = d.website.startsWith('http') ? d.website : 'http://' + d.website;
  const linkStyle = 'color:#1a5f5a; text-decoration:underline;';

  // 英文地址在 No. 168 后强制换行
  const addrEnFormatted = d.addrEn.replace('No. 168 ', 'No. 168<br>');

  return `
<div style="font-family:Arial,'Microsoft YaHei',sans-serif; font-size:10px; color:#000000; line-height:1.5; max-width: 500px;">
  <div style="margin-bottom: 16px; font-size: 13px;">${d.greeting}</div>
  
  <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 500px;">
    <tr>
      <!-- 【修改点】Logo 宽度从 100px 缩小到 90px -->
      <td style="padding-right:8px; vertical-align:top; width: 90px;">
        <img src="${d.logoUrl}" alt="HITI" width="90"
             style="display:block; border:0; max-width:90px;">
      </td>
      
      <td style="vertical-align:top; border-left:1px solid #000000; padding-left:8px; width: 340px; word-break: break-word;">
        
        <div style="font-size:13px; font-weight:bold; color:#1a5f5a; margin-bottom: 4px;">
          ${d.nameCn} ${d.nameEn}
        </div>
        
        <div style="font-weight:bold; font-size:10px; margin-bottom: 24px;">
          ${d.title}
        </div>
        
        <div style="margin-bottom: 2px;">
          <span style="display:inline-block; width:48px; font-weight:bold;">Mobile :</span> ${d.mobile}
        </div>
        
        <div style="margin-bottom: 24px;">
          <span style="display:inline-block; width:48px; font-weight:bold;">Email :</span> 
          <a href="mailto:${emailLink}" style="${linkStyle}">${d.email}</a>
        </div>
        
        <div style="margin-bottom: 2px;">${d.companyCn}</div>
        <div style="margin-bottom: 2px;">${d.companyEn}</div>
        
        <div style="margin-bottom: 2px;">${d.addrCn}</div>
        <div style="margin-bottom: 14px;">${addrEnFormatted}</div>
        
        <div>
          <a href="${webLink}" style="${linkStyle}">${d.website}</a>
        </div>
        
      </td>
    </tr>
  </table>
</div>`.trim();
}

// ========== 渲染预览 ==========
function render() {
  document.getElementById('preview').innerHTML = buildSignature(getData());
}

// ========== 按钮状态反馈 ==========
function showBtnDone(btn, originalText) {
  btn.textContent = '已复制 ✓';
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = originalText; btn.classList.remove('done'); }, 2000);
}

// ========== 【按钮1】复制 HTML 代码 ==========
async function copyHtmlCode() {
  const html = buildSignature(getData());
  const btn = document.getElementById('btnCopy');
  const originalText = btn.textContent;
  try {
    await navigator.clipboard.writeText(html);
    showBtnDone(btn, originalText);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showBtnDone(btn, originalText);
  }
}

// ========== 【按钮2】一键复制富文本签名 ==========
async function copyRichSignature() {
  const previewDiv = document.getElementById('preview');
  const btn = document.getElementById('btnCopyRich');
  const originalText = btn.textContent;
  
  try {
    const html = previewDiv.innerHTML;
    const blob = new Blob([html], {type: 'text/html'});
    const data = [new ClipboardItem({'text/html': blob})];
    await navigator.clipboard.write(data);
    showBtnDone(btn, originalText);
  } catch (e) {
    try {
      const range = document.createRange();
      range.selectNode(previewDiv);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      showBtnDone(btn, originalText);
    } catch (err) {
      alert('当前浏览器不支持一键复制，请手动选中预览区域的内容进行复制。');
    }
  }
}

// ========== 【按钮3】下载 Logo ==========
document.getElementById('btnDownloadLogo').addEventListener('click', async () => {
    const url = document.getElementById('logoUrl').value.trim();
    if (!url) return alert('请先填写 Logo 图片 URL');

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('网络响应异常');
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'HITI_logo.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
    } catch (error) {
        alert('当前浏览器安全策略限制了跨域图片直接下载。将为您在新标签页打开该图片，请右键选择“图片另存为”。');
        window.open(url, '_blank');
    }
});

// ========== 绑定事件 ==========
document.querySelectorAll('.form input').forEach(el => {
  el.addEventListener('input', render);
});
document.getElementById('btnCopy').addEventListener('click', copyHtmlCode);
document.getElementById('btnCopyRich').addEventListener('click', copyRichSignature);

// 初始渲染
render();
</script>
</body>
</html>
