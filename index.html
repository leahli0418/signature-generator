<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱签名生成器</title>
<style>
  body { margin:0; padding:24px; background:#f5f5f5;
         font-family:"Microsoft YaHei",Arial,sans-serif; color:#333; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }
  .panel { background:#fff; border-radius:8px; padding:16px 20px;
           margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { font-size:15px; margin:0 0 12px; }
  .form { display:flex; flex-wrap:wrap; gap:12px 20px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; color:#666; }
  .field input { width:220px; padding:6px 8px; border:1px solid #ccc;
                 border-radius:4px; font-size:14px; box-sizing:border-box; }
  #btnCopy { padding:8px 22px; font-size:14px; background:#1a73e8; color:#fff;
             border:0; border-radius:4px; cursor:pointer; margin-top:12px; }
  #btnCopy:hover { background:#1667cf; }
  #btnCopy.done { background:#2e9e44; }
  #preview { background:#f5f5f5; padding:16px; overflow:auto; }
  ol.steps { margin:0; padding-left:20px; font-size:13px; line-height:2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>邮箱签名生成器</h1>

  <!-- ===== 1. 填写信息 ===== -->
  <div class="panel">
    <h2>1. 填写信息</h2>
    <div class="form">
      <div class="field">
        <label>姓名（中文）</label>
        <input id="nameCn" value="李靓" placeholder="如：李靓">
      </div>
      <div class="field">
        <label>姓名（英文）</label>
        <input id="nameEn" value="Leah Li" placeholder="如：Leah Li">
      </div>
      <div class="field">
        <label>职位</label>
        <input id="title" value="执行总裁助理 Assistant to CEO" placeholder="如：执行总裁助理 Assistant to CEO">
      </div>
      <div class="field">
        <label>手机号</label>
        <input id="mobile" value="+86 137 6465 6552" placeholder="如：+86 137 6465 6552">
      </div>
      <div class="field">
        <label>邮箱</label>
        <input id="email" value="leah@dinengchuang.com" placeholder="如：leah@dinengchuang.com">
      </div>
      <div class="field">
        <label>公司中文名</label>
        <input id="companyCn" value="上海迪能创高新科技有限公司" placeholder="如：上海迪能创高新科技有限公司">
      </div>
      <div class="field">
        <label>公司英文名</label>
        <input id="companyEn" value="Shanghai Dineng Chuang High Tech Co., Ltd." placeholder="如：Shanghai Dineng Chuang High Tech Co., Ltd.">
      </div>
      <div class="field">
        <label>地址（中文）</label>
        <input id="addrCn" value="上海市浦东新区银城中路168号上海银行大厦24层2401室" placeholder="如：上海市浦东新区银城中路168号上海银行大厦24层2401室">
      </div>
      <div class="field">
        <label>地址（英文）</label>
        <input id="addrEn" value="24th Floor, Suite 2401, Shanghai Bank Tower, No. 168 Yincheng Middle Rd, Pudong New District, Shanghai, China" placeholder="如：24th Floor, Suite 2401, Shanghai Bank Tower...">
      </div>
      <div class="field">
        <label>网址</label>
        <input id="website" value="www.hiti.ae" placeholder="如：www.hiti.ae">
      </div>
      <div class="field">
        <label>Logo 图片 URL</label>
        <input id="logoUrl" value="https://via.placeholder.com/150x60?text=HITI" placeholder="粘贴你公司Logo的图片链接">
      </div>
    </div>
  </div>

  <!-- ===== 2. 实时预览 ===== -->
  <div class="panel">
    <h2>2. 实时预览</h2>
    <div id="preview"></div>
  </div>

  <!-- ===== 3. 复制代码 ===== -->
  <div class="panel">
    <h2>3. 复制并粘贴到企业邮箱</h2>
    <button id="btnCopy">复制 HTML 代码</button>
    <ol class="steps">
      <li>打开 PC 端企业邮箱，进入「邮件设置」→「写邮件」→「管理签名样式」</li>
      <li>点击「创建签名」→「更多」→「编辑 HTML 源码」</li>
      <li>粘贴复制的代码，然后选中签名中的占位图片，通过「插入图片」上传真实 logo</li>
      <li>保存并设为使用中的签名</li>
    </ol>
  </div>
</div>

<script>
// ========== 读取所有表单字段 ==========
function getData() {
  const ids = ['nameCn','nameEn','title','mobile','email',
               'companyCn','companyEn','addrCn','addrEn','website','logoUrl'];
  const d = {};
  ids.forEach(id => d[id] = document.getElementById(id).value.trim());
  return d;
}

// ========== 生成签名 HTML 模板（完全按照图片一比一） ==========
function buildSignature(d) {
  // 处理邮箱和网址的链接（去掉空格，补全http）
  const emailLink = d.email.replace(/\s/g,'');
  const webLink = d.website.startsWith('http') ? d.website : 'http://' + d.website;

  return `
<table cellpadding="0" cellspacing="0" border="0"
       style="font-family:Arial,'Microsoft YaHei',sans-serif;
              font-size:14px; color:#000000; line-height:1.6;">
  <tr>
    <!-- 左侧：Logo -->
    <td style="padding-right:24px; vertical-align:top;">
      <img src="${d.logoUrl}" alt="HITI" width="150"
           style="display:block; border:0; max-width:150px;">
    </td>
    
    <!-- 右侧：文字信息，加左边框 -->
    <td style="vertical-align:top; border-left:1px solid #000000; padding-left:24px;">
      
      <!-- 名字（深墨绿色，加粗） -->
      <div style="font-size:16px; font-weight:bold; color:#1a5f5a; margin-bottom:8px;">
        ${d.nameCn} ${d.nameEn}
      </div>
      
      <!-- 职位（加粗） -->
      <div style="font-weight:bold; margin-bottom:24px;">
        ${d.title}
      </div>
      
      <!-- 联系方式 -->
      <div style="margin-bottom:6px;">
        <span style="font-weight:bold;">Mobile :</span> ${d.mobile}
      </div>
      <div style="margin-bottom:24px;">
        <span style="font-weight:bold;">Email :</span> 
        <a href="mailto:${emailLink}" style="color:#0000ee; text-decoration:underline;">${d.email}</a>
      </div>
      
      <!-- 公司信息 -->
      <div style="margin-bottom:2px;">${d.companyCn}</div>
      <div style="margin-bottom:24px;">${d.companyEn}</div>
      
      <!-- 地址 -->
      <div style="margin-bottom:2px;">${d.addrCn}</div>
      <div style="margin-bottom:24px;">${d.addrEn}</div>
      
      <!-- 网址 -->
      <div>
        <a href="${webLink}" style="color:#0000ee; text-decoration:underline;">${d.website}</a>
      </div>
      
    </td>
  </tr>
</table>`.trim();
}

// ========== 渲染预览 ==========
function render() {
  document.getElementById('preview').innerHTML = buildSignature(getData());
}

// ========== 复制到剪贴板 ==========
async function copySignature() {
  const html = buildSignature(getData());
  const btn = document.getElementById('btnCopy');
  try {
    await navigator.clipboard.writeText(html);
    btn.textContent = '已复制 ✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '复制 HTML 代码'; btn.classList.remove('done'); }, 2000);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制 ✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '复制 HTML 代码'; btn.classList.remove('done'); }, 2000);
  }
}

// ========== 绑定事件 ==========
document.querySelectorAll('.form input').forEach(el => {
  el.addEventListener('input', render);
});
document.getElementById('btnCopy').addEventListener('click', copySignature);

// 初始渲染
render();
</script>
</body>
</html>
